  <style>
    :root{
      --fond:#0d1621;

      --or-clair:#E8C97A;
      --creme:#F0EDE6;

    html,body{height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--fond);
      color:var(--creme);
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      text-align:center;padding:28px 22px;min-height:100vh;
    }
    .spinner{
      width:44px;height:44px;
      border:3px solid rgba(201,168,76,.25);
      border-top-color:var(--or);border-radius:50%;

    @keyframes spin{to{transform:rotate(360deg)}}

    a.bouton{
      display:flex;align-items:center;gap:14px;

      font-size:1rem;font-weight:600;
      transition:transform .1s, background .2s;

<body>
  <div class="spinner" id="spin"></div>
  <h1 id="titre">Un instant...</h1>
  <p class="sous" id="sous">Chargement</p>

  <div class="menu" id="menu"></div>
  <p class="merci" id="merci" style="display:none">Merci pour votre confiance</p>

  <script>
  (function () {
    // ---- CONFIG : colle ici l'URL de ton Apps Script pour compter les scans ----
    var SCRIPT_URL = "";

    // Libelles + icones des boutons, dans l'ordre d'affichage souhaite
    var BOUTONS = {
      google:    { ico:"\u2B50", texte:"Laisser un avis Google", classe:"google" },
      instagram: { ico:"\uD83D\uDCF8", texte:"Nous suivre sur Instagram" },
      facebook:  { ico:"\uD83D\uDC4D", texte:"Nous suivre sur Facebook" },
      tiktok:    { ico:"\uD83C\uDFB5", texte:"Nous suivre sur TikTok" },
      whatsapp:  { ico:"\uD83D\uDCAC", texte:"Nous ecrire sur WhatsApp" },
      menu:      { ico:"\uD83D\uDCCB", texte:"Voir le menu" },
      site:      { ico:"\uD83C\uDF10", texte:"Voir le site" }
    };

    var params = new URLSearchParams(window.location.search);
    var id = (params.get("id") || "").trim();

    var spin  = document.getElementById("spin");
    var titre = document.getElementById("titre");
    var sous  = document.getElementById("sous");
    var menu  = document.getElementById("menu");
    var merci = document.getElementById("merci");

    function erreur(txt){
      document.body.classList.add("err");
      spin.style.display="none";
      titre.textContent=txt;
      sous.textContent="Contactez le responsable de cette plaque.";
    }

    function compterScan(){
      if(!SCRIPT_URL) return;
      try{
        var img=new Image();
        img.src=SCRIPT_URL+"?id="+encodeURIComponent(id)+"&t="+Date.now();
      }catch(e){}
    }

    if(!id){ erreur("Plaque non configuree"); return; }

    fetch("destinations.json?v="+Date.now())
      .then(function(r){return r.json();})
      .then(function(dest){
        var cible=dest[id];
        if(!cible){ erreur("Plaque inconnue"); return; }

        compterScan();

        // CAS 1 : un seul lien (texte) -> redirection directe
        if(typeof cible==="string"){
          setTimeout(function(){ window.location.replace(cible); },250);
          return;
        }

        // CAS 2 : plusieurs liens (objet) -> on affiche le menu
        spin.style.display="none";
        titre.textContent = cible.nom || "Bienvenue !";
        sous.textContent  = "Que souhaitez-vous faire ?";

        Object.keys(BOUTONS).forEach(function(cle){
          if(cible[cle]){
            var b=BOUTONS[cle];
            var a=document.createElement("a");
            a.href=cible[cle];
            a.className="bouton"+(b.classe?" "+b.classe:"");
            a.innerHTML='<span class="ico">'+b.ico+'</span>'+b.texte;
            menu.appendChild(a);
          }
        });

        menu.style.display="flex";
        merci.style.display="block";
      })
      .catch(function(){ erreur("Erreur de chargement"); });
  })();
  </script>
</body>
</html>

  <style>
    :root{
      --fond:#0d1621;      /* ta couleur ProTap sombre */
      --or:#C9A84C;
      --or-clair:#E8C97A;
      --creme:#F0EDE6;

      font-size:.95rem;
    }

  </style>

<body>
  <div class="spinner" id="spin"></div>
  <h1 id="msg">Redirection en cours…</h1>
  <p id="sub">Merci de patienter une seconde</p>
  <a class="btn" id="fallback" href="#">Continuer &rarr;</a>

  <script>
  (function () {
    // ---- CONFIG : à remplir une seule fois ----
    // URL de ton Google Apps Script déployé (voir MODE-EMPLOI.md, étape 3).
    // Laisse vide ("") tant que tu ne l'as pas : la redirection marchera quand même,
    // seul le comptage des scans sera désactivé.
    var SCRIPT_URL = "";

    // 1) Récupère l'id dans l'URL : ...?id=barber-nice-01
    var params = new URLSearchParams(window.location.search);
    var id = (params.get("id") || "").trim();

    var msg = document.getElementById("msg");
    var sub = document.getElementById("sub");
    var spin = document.getElementById("spin");
    var fb  = document.getElementById("fallback");

    function erreur(texte) {
      document.body.classList.add("err");
      spin.style.display = "none";
      msg.textContent = texte;
      sub.textContent = "Contactez le responsable de cette plaque.";
    }

    if (!id) { erreur("Plaque non configurée"); return; }

    // 2) Charge la table des destinations (id -> lien Google du commerçant)
    fetch("destinations.json?v=" + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (dest) {
        var cible = dest[id];
        if (!cible) { erreur("Plaque inconnue"); return; }

        // 3) Compte le scan (envoi "fire and forget", ne bloque JAMAIS la redirection)
        if (SCRIPT_URL) {
          try {
            var img = new Image();
            img.src = SCRIPT_URL
              + "?id=" + encodeURIComponent(id)
              + "&t="  + Date.now()
              + "&ref="+ encodeURIComponent(document.referrer || "");
          } catch (e) { /* on ignore, la redirection prime */ }
        }

        // 4) Prépare le bouton de secours (si la redirection auto est bloquée)
        fb.href = cible;
        fb.style.display = "inline-block";

        // 5) Redirige (petit délai pour laisser partir le beacon de comptage)
        setTimeout(function () { window.location.replace(cible); }, 250);
      })
      .catch(function () {
        erreur("Erreur de chargement");
      });
  })();
  </script>
</body>
</html>
